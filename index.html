<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi Santé – Taxi conventionné à Behren-lès-Forbach</title>
<meta name="description" content="Taxi conventionné à Forbach : transport médical assis vers Metz, Nancy et Strasbourg. Cancer, ALD, consultations spécialisées, examens, hospitalisation. Réservation en ligne ou au 06 95 02 02 97.">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:local("Atkinson Hyperlegible"),local("AtkinsonHyperlegible-Regular"),url("fonts/AtkinsonHyperlegible-Regular.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:local("Atkinson Hyperlegible Bold"),local("AtkinsonHyperlegible-Bold"),url("fonts/AtkinsonHyperlegible-Bold.woff2") format("woff2")}
:root{
--night:#0a1630; --taxi:#f6b90f; --taxi-ink:#1a1400; --wa:#25d366; --wa-dark:#128c4a;
--bg:#f3f6fb; --surface:#fff; --ink:#12203d; --muted:#4d5b78; --line:#d6deeb; --brand:#17407f;
--dock-h:4.4rem; --gutter:max(1.25rem,env(safe-area-inset-left,0px));
--gutter-r:max(1.25rem,env(safe-area-inset-right,0px));
color-scheme:light dark; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bg:#0d1932;--surface:#14223f;--ink:#eef3fc;--muted:#a8b5cf;--line:#27375a;--brand:#f6b90f}
}
:root[data-theme="dark"]{--bg:#0d1932;--surface:#14223f;--ink:#eef3fc;--muted:#a8b5cf;--line:#27375a;--brand:#f6b90f}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,sans-serif;font-size:clamp(1rem,.95rem + .25vw,1.125rem);line-height:1.6;padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 1rem);overflow-x:hidden}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
a:focus-visible,.btn:focus-visible,.wa-bubble:focus-visible{outline:3px solid var(--taxi);outline-offset:3px}

/* HERO */
.hero{position:relative;min-height:min(100svh,44rem);color:#fff;background:linear-gradient(180deg,#123a78 0%,#2a74cf 52%,#8fd6f6 100%);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:calc(1rem + env(safe-area-inset-top,0px)) var(--gutter-r) 0 var(--gutter)}
.hero>*{position:relative}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem .8rem}
.mark{font-weight:700;font-size:1.3rem}
.badge{font-size:.85rem;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:.15rem .7rem}
.hero h1{font-size:clamp(1.7rem,5.6vw,2.8rem);max-width:20ch;margin-top:1.5rem}
.hero p{max-width:40ch;font-size:clamp(1rem,.95rem + .4vw,1.2rem);margin:.9rem 0 0}
