<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function build(){

    if(!nom||!tel||!dep||!dest){$("err").textContent="Merci de remplir : nom, téléphone, adresse de départ et destination.";return null}
    $("err").textContent="";
    var d=$("date").value,h=$("heure").value;
    var l=["Bonjour, je souhaite réserver un taxi.","Nom : "+nom,"Téléphone : "+tel];
    if(d)l.push("Date : "+d.split("-").reverse().join("/"));
    if(h)l.push("Heure du rendez-vous : "+h);
    l.push("Départ : "+dep,"Destination : "+dest,"Type : "+$("type").value,"Aller-retour : "+($("ar").checked?"oui":"non"));
    if($("msg").value.trim())l.push("Précisions : "+$("msg").value.trim());
    return l.join("\n");
  }
  function open(url){var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
  $("bwa").onclick=function(){var m=build();if(m)open("https://wa.me/33695020297?text="+encodeURIComponent(m))};
  $("bml").onclick=function(){var m=build();if(m)open("mailto:contact@taxisante.com?subject="+encodeURIComponent("Réservation taxi")+"&body="+encodeURIComponent(m))};
})();
</script>
