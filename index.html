<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi Santé – Taxi conventionné à Behren-lès-Forbach</title>
<meta name="description" content="Taxi conventionné à Forbach : transport médical assis vers Metz, Nancy et Strasbourg. Cancer, ALD, consultations spécialisées, examens, hospitalisation. Réservation en ligne ou au 06 95 02 02 97.">
<style>
:root{
  --night:#0a1630; --taxi:#f6b90f; --taxi-ink:#1a1400;
  --bg:#f3f6fb; --surface:#fff; --ink:#12203d; --muted:#4d5b78; --line:#d6deeb; --brand:#17407f;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1932;--surface:#14223f;--ink:#eef3fc;--muted:#a8b5cf;--line:#27375a;--brand:#f6b90f}
}
:root[data-theme="dark"]{--bg:#0d1932;--surface:#14223f;--ink:#eef3fc;--muted:#a8b5cf;--line:#27375a;--brand:#f6b90f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Verdana,sans-serif;-webkit-text-size-adjust:100%;font-size:1.25rem;line-height:1.7;padding-bottom:5.5rem}
h1,h2,h3{font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--taxi);outline-offset:3px}

.hero{position:relative;min-height:100svh;min-height:100vh;color:#fff;background:linear-gradient(180deg,#123a78 0%,#2a74cf 52%,#8fd6f6 100%);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.5rem 2rem}
.hero>*{position:relative}
.hero>.top,.hero>div{width:100%;max-width:46rem;margin-left:auto;margin-right:auto}
html{scroll-behavior:smooth}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (min-width:900px){.scene{height:clamp(300px,46vh,480px)}.dock{display:none}body{padding-bottom:1rem}.hero h1{font-size:clamp(3rem,5vw,4.4rem)}}
@media (max-width:360px){.btn{font-size:1.05rem;padding:.7rem 1rem}.badge{font-size:.85rem}}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.mark{font-weight:700;font-size:1.5rem}
.badge{font-size:.95rem;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:.2rem .8rem}
.hero h1{font-size:clamp(2.2rem,8.5vw,3.8rem);max-width:16ch;margin-top:2rem}
.hero p{max-width:36ch;font-size:1.3rem;margin:1rem 0 0}
.scene{display:block;width:calc(100% + 3rem);margin:auto -1.5rem -2rem;height:clamp(220px,40vh,380px)}
